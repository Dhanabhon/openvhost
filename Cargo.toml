[workspace]
resolver = "2"
members = [
    "crates/openvhost-core",
    "crates/openvhost-proc",
    "crates/openvhost-pkg",
    "crates/openvhost-conf",
    "apps/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
dirs = "6"
tokio = { version = "1.53", features = ["process", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
