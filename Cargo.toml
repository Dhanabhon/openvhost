[workspace]
resolver = "2"
members = [
    "crates/openvhost-core",
    "crates/openvhost-proc",
    "crates/openvhost-pkg",
    "crates/openvhost-conf",
    "apps/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
dirs = "6"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
