[package]
name = "openvhost-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "openvhost_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json = "1"
# The settings pre-check is injected as a trait object so the save path is
# testable without nginx installed; already in the tree via openvhost-conf and
# openvhost-core, so this adds no new crate to Cargo.lock.
async-trait = "0.1"
thiserror.workspace = true
# `fs` on top of the workspace features: `read_web_server_config` reads the live
# config with `tokio::fs` rather than blocking a worker thread. `tauri` happens to
# enable `fs` too, but relying on another crate's feature unification is how a
# build breaks later. Adds no dependency — tokio's `fs = []`.
tokio = { workspace = true, features = ["fs"] }
openvhost-core = { path = "../../../crates/openvhost-core", features = ["specta"] }
openvhost-proc = { path = "../../../crates/openvhost-proc", features = ["specta"] }
# No `specta` feature: nothing from this crate crosses IPC directly — the
# web-server commands map its `ValidationReport` onto a local DTO.
openvhost-conf = { path = "../../../crates/openvhost-conf" }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }

[dev-dependencies]
# `test` ONLY, and only here: `tauri::test::mock_builder` is the sole way to obtain
# a `tauri::State` — `State`'s single field is private and `StateManager::new` is
# `pub(crate)` — which is what lets `list_web_servers` be driven as itself rather
# than through a testable helper carved out of it. Verified against tauri 2.11.3
# that the feature gates NOTHING but the `tauri::test` module (`src/lib.rs:1098`):
# it does not touch `invoke_key`, the ACL, or the CSP. Adds no new crate to
# Cargo.lock. Verified against the version the lockfile actually resolves, tauri
# 2.11.5 — name it or drop it, but do not leave a stale number here, because the
# claim above is only as good as the version it was checked against.
# CI note: dev-dependency features are not unified into `cargo build`, so
# `cargo build --workspace` and `cargo test --workspace` compile `tauri` with
# different feature sets and each keeps its own cached artifact. That property
# comes from `resolver = "2"`, pinned explicitly in the workspace Cargo.toml —
# NOT from the edition, as an earlier version of this comment said. Under
# resolver v1 the feature WOULD leak into the shipped build, so if that pin ever
# changes, re-verify with:
#   cargo tree -p openvhost-desktop -e features --edges normal,build -i tauri
# The `test` feature must be absent from that graph.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
# `test`-only, unix-gated: the C1 regression test in `quit.rs` polls a real
# spawned child with `kill(pid, 0)`/`SIGKILL` the same way
# `openvhost-proc`'s own `tests/task_group.rs` does, to prove
# `abort_pending_install` genuinely drops the run's future rather than
# merely returning `true`.
libc = "0.2"

[lints]
workspace = true
