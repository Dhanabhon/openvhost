[package]
name = "openvhost-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "openvhost_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
openvhost-core = { path = "../../../crates/openvhost-core", features = ["specta"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }

[lints]
workspace = true
