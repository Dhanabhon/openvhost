[package]
name = "openvhost-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
serde.workspace = true
thiserror.workspace = true
dirs.workspace = true
sqlx.workspace = true
uuid.workspace = true
specta = { version = "2.0.0-rc.25", optional = true, features = ["derive"] }
openvhost-conf = { path = "../openvhost-conf" }
# The download → SHA-256 verify → extract → atomic-install pipeline behind
# `mysql::package`. Acyclic: openvhost-pkg depends only on openvhost-proc,
# never on this crate, and neither depends on tauri.
openvhost-pkg = { path = "../openvhost-pkg" }
openvhost-proc = { path = "../openvhost-proc" }
similar = "2"
tracing = "0.1"

[features]
specta = ["dep:specta"]

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { workspace = true }
# `mysql::package::install`'s hermetic tests build a real .tar.gz in memory and
# serve it over loopback, so the install pipeline is exercised end to end
# without the network. Test-only, and already in Cargo.lock via openvhost-pkg.
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
# Only used by the macOS-gated `tests/mysql_live.rs` orphan-check
# (`libc::kill(pid, 0)`), mirroring openvhost-proc's identical dev-dependency.
libc = "0.2"

[lints]
workspace = true
