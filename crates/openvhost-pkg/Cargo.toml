[package]
name = "openvhost-pkg"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tokio.workspace = true
# The post-extract warm-up exec (install.rs) goes through the supervisor's
# process driver rather than spawning a child here: repo rule — EVERY child
# process in the codebase is spawned through openvhost-proc. That buys the
# warm-up its own process group (so a hung probe's whole tree is killed, not
# just the direct child) and the allow-list environment, for free. Acyclic:
# openvhost-proc depends on no other workspace crate.
openvhost-proc = { path = "../openvhost-proc" }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
unicode-normalization = "0.1"
url = "2"
hex = "0.4"
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
