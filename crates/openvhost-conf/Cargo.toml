[package]
name = "openvhost-conf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tera = { version = "1", default-features = false }
async-trait = "0.1"
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# `test-util` only: lets the inspect timeout test advance tokio's clock virtually
# instead of burning PROBE_TIMEOUT (5s) of real time on every run. Dev-only, so
# it is never compiled into the library or either binary; adds no new crate to
# Cargo.lock (it just enables tokio-internal code paths).
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
